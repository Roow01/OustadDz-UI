<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OustadDz | مساعدك الشخصي</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_9ccjp9ccjp9ccjp9.jpeg">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --user-msg: #f3f4f6;
            --bot-msg: #ffffff;
            --border: #e5e7eb;
            --primary: #10a37f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            z-index: 10;
        }
        .header-info { display: flex; align-items: center; gap: 10px; }
        .header-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .header-text h1 { font-size: 1rem; font-weight: 700; }
        .header-text span { font-size: 0.7rem; color: #64748b; }
        
        .icon-btn {
            background: transparent; border: none; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 8px; color: var(--text);
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--user-msg); }
        .icon-btn svg { width: 20px; height: 20px; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 20px; }

        .message-wrapper { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }
        .message-wrapper.user { align-items: flex-end; }
        .message-wrapper.bot { align-items: flex-start; }

        .message { 
            padding: 12px 18px; border-radius: 16px; line-height: 1.7; font-size: 0.95rem; 
            max-width: 85%; word-wrap: break-word;
        }
        .user-message { background: var(--user-msg); color: var(--text); border-bottom-right-radius: 4px; }
        .bot-message { background: var(--bot-msg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        .bot-message h1, .bot-message h2, .bot-message h3 { margin-bottom: 10px; font-size: 1.1rem; font-weight: 700;}
        .bot-message ul, .bot-message ol { padding-right: 20px; margin-bottom: 10px; }
        .bot-message table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
        .bot-message th, .bot-message td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        .bot-message blockquote { border-right: 4px solid #cbd5e1; padding-right: 10px; color: #64748b; margin: 10px 0; font-style: italic; }

        #input-area {
            padding: 15px; background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: center; flex-direction: column; align-items: center;
        }
        .input-container {
            display: flex; align-items: center; gap: 8px; width: 100%; max-width: 800px;
            background: var(--user-msg); border-radius: 24px; padding: 8px 12px;
        }
        #message-input {
            flex: 1; background: transparent; border: none; color: var(--text);
            padding: 10px 5px; font-size: 0.95rem; outline: none; resize: none;
        }
        .input-icon-btn {
            background: transparent; border: none; cursor: pointer; color: #64748b;
            display: flex; align-items: center; justify-content: center;
            width: 35px; height: 35px; border-radius: 50%; transition: background 0.2s;
        }
        .input-icon-btn:hover { background: #e2e8f0; }
        .input-icon-btn svg { width: 20px; height: 20px; }
        .send-btn { background: var(--primary); color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
        .send-btn:disabled { background: #a1a1aa; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; transform: rotate(180deg); }

        .mic-active { color: #ef4444 !important; background: #fee2e2 !important; }

        .typing-indicator { display: none; align-self: flex-start; background: var(--bot-msg); padding: 10px 18px; border-radius: 16px; border: 1px solid var(--border); color: #64748b; font-size: 0.9rem; margin: 0 auto 0 0; width: fit-content; }
        .typing-indicator.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        #image-preview { display: none; align-items: center; gap: 10px; background: #f1f5f9; padding: 8px; border-radius: 12px; font-size: 0.85rem; margin: 0 auto 10px auto; max-width: 800px; width: 100%; }
        #image-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
        #remove-image { cursor: pointer; color: #ef4444; background: none; border: none; display: flex; }

        footer { text-align: center; padding: 10px; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <div class="header-info">
            <img src="Gemini_Generated_Image_9ccjp9ccjp9ccjp9.jpeg" alt="Qimah">
            <div class="header-text">
                <h1>OustadDz</h1>
                <span>مساعدك الشخصي في الرياضيات</span>
            </div>
        </div>
        <div style="display: flex; gap: 5px;">
            <button class="icon-btn" onclick="clearHistory()" title="محادثة جديدة">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </header>

    <div id="chat-container">
        <div id="typing" class="typing-indicator">OustadDz يكتب الآن...</div>
    </div>

    <div id="input-area">
        <div id="image-preview">
            <img id="preview-img" src="" alt="Preview">
            <span>صورة مرفقة</span>
            <button id="remove-image" onclick="clearImage()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="input-container">
            <button class="input-icon-btn" onclick="document.getElementById('file-input').click()" title="رفع صورة">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </button>
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            
            <button class="input-icon-btn" id="mic-btn" onclick="toggleSpeechRecognition()" title="تحدث">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>

            <button class="send-btn" id="send-btn" onclick="sendMessage()" title="إرسال">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    </div>

    <footer>Powered by Qimah Production | V 1.1</footer>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }

        const API_URL = "https://oustaddz.onrender.com/chat";
        let currentImageBase64 = null;
        
        window.onload = function() {
            const history = JSON.parse(localStorage.getItem('oustdz_chat_history')) || [];
            if (history.length === 0) {
                addMessageToDOM("مرحباً بك! أنا <b>OustadDz</b>، مساعدك الشخصي. كيف يمكنني مساعدتك اليوم؟", 'bot');
                saveMessage("مرحباً بك! أنا <b>OustadDz</b>، مساعدك الشخصي. كيف يمكنني مساعدتك اليوم؟", 'bot');
            } else {
                history.forEach(msg => addMessageToDOM(msg.text, msg.sender, false));
            }
        };

        function clearHistory() {
            if(confirm("هل أنت متأكد من بدء محادثة جديدة؟ سيتم مسح السجل الحالي.")) {
                localStorage.removeItem('oustdz_chat_history');
                location.reload();
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let scale = 1;
                    if (img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-img').src = currentImageBase64;
                    document.getElementById('image-preview').style.display = 'flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            currentImageBase64 = null;
            document.getElementById('file-input').value = "";
            document.getElementById('image-preview').style.display = 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !currentImageBase64) return;

            addMessageToDOM(text, 'user');
            saveMessage(text, 'user');
            
            input.value = '';
            const imgToSend = currentImageBase64;
            clearImage();

            const typing = document.getElementById('typing');
            typing.classList.add('active');
            typing.innerText = "OustadDz يكتب الآن...";
            document.getElementById('send-btn').disabled = true;

            const sleepTimer = setTimeout(() => {
                typing.innerText = "جاري استيقاظ الخادم (قد يستغرق 30 ثانية)... ⏳";
            }, 4000);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text || "حلل هذه الصورة",
                        image_base64: imgToSend
                    })
                });

                if (!response.ok) throw new Error("HTTP error " + response.status);
                
                const data = await response.json();
                clearTimeout(sleepTimer);
                typing.classList.remove('active');
                
                addMessageToDOM(data.reply, 'bot');
                saveMessage(data.reply, 'bot');

            } catch (error) {
                clearTimeout(sleepTimer);
                typing.classList.remove('active');
                addMessageToDOM("عذراً، الخادم لا يستجيب حالياً. يرجى المحاولة بعد قليل.", 'bot');
            } finally {
                document.getElementById('send-btn').disabled = false;
            }
        }

        function addMessageToDOM(text, sender, animate = true) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>').replace(/\n/g, '<br>');
            msgDiv.innerHTML = formattedText;
            
            wrapper.appendChild(msgDiv);
            
            const typing = document.getElementById('typing');
            container.insertBefore(wrapper, typing);
            container.scrollTop = container.scrollHeight;
            
            if (sender === 'bot' && window.MathJax) {
                MathJax.typesetPromise([msgDiv]);
            }
        }

        function saveMessage(text, sender) {
            const history = JSON.parse(localStorage.getItem('oustdz_chat_history')) || [];
            history.push({ text, sender });
            localStorage.setItem('oustdz_chat_history', JSON.stringify(history));
        }

        let isRecording = false;
        let recognition = null;

        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم إدخال الصوت. استخدم Chrome.");
                return;
            }
            const micBtn = document.getElementById('mic-btn');
            const inputField = document.getElementById('message-input');

            if (isRecording) {
                if (recognition) recognition.stop();
                micBtn.classList.remove('mic-active');
                isRecording = false;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ar-DZ'; 
            recognition.interimResults = false;

            recognition.onstart = function() {
                isRecording = true;
                micBtn.classList.add('mic-active');
                inputField.placeholder = "جاري الاستماع... تحدث الآن";
            };

            recognition.onresult = function(event) {
                inputField.value += " " + event.results[0][0].transcript;
            };

            recognition.onerror = function() {
                micBtn.classList.remove('mic-active');
                isRecording = false;
                inputField.placeholder = "اكتب رسالتك هنا...";
            };

            recognition.onend = function() {
                micBtn.classList.remove('mic-active');
                isRecording = false;
                inputField.placeholder = "اكتب رسالتك هنا...";
            };

            recognition.start();
        }
    </script>
</body>
</html>
